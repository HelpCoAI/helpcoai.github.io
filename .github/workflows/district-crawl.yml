# Harvests school-counselor and foundation scholarship pages on a GitHub runner,
# which has the open network access the dev sandbox does not.
#
# Each seed set runs as its own parallel job, because harvesting all of them in one
# sequential job exceeded the timeout once the Miami-Dade set (52 schools) was added.
# Jobs upload artifacts; a single collect job commits, so parallel pushes cannot race.
#
# Already-harvested sets are SKIPPED by default. These pages change once or twice a
# year, and re-crawling them repeatedly is what tripped the WAFs on
# gablesfoundation.org and miamifoundation.org -- sites that returned 14KB on the
# first pass and 1 byte on the fourth. Use the `force` input to re-harvest anyway.

name: District crawl

on:
  push:
    branches:
      - claude/grants-scholarships-app-idea-7xdfgz
    paths:
      - "grants/data/district_seeds*.json"
      - "grants/scripts/10_district_crawl.py"
      - ".github/workflows/district-crawl.yml"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-harvest sets that already have pages committed"
        type: boolean
        default: false
      enrich_limit:
        description: "Enrich only the first N awards (0 = all). Use 40 for a ~$0.11 sample."
        type: string
        default: "0"

permissions:
  contents: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Enumerate scholarship-platform tenants via certificate transparency
        working-directory: grants
        run: |
          if [ -f data/district_seeds_platforms.json ]; then
            echo "already enumerated - skipping"; exit 0
          fi
          python3 scripts/18_platform_enum.py \
            --out data/district_seeds_platforms.json --cap 120 2>&1 | tail -20

      - name: Discover URLs from sitemaps and slug probes
        working-directory: grants
        run: |
          if [ -f data/district_seeds_discovered.json ]; then
            echo "already discovered - skipping"; exit 0
          fi
          python3 scripts/16_discover_urls.py \
            --seeds data/district_seeds_schools_miami_dade.json \
                    data/district_seeds_bmf_orgs.json \
            --out data/district_seeds_discovered.json --limit 35 --slugs
      - name: Commit discovered seeds
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grants/data/district_seeds_discovered.json grants/data/district_seeds_platforms.json 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "nothing new"
          else
            git commit -m "Add discovered and platform-tenant seeds (automated)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

  harvest:
    needs: discover
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        set:
          - { file: "district_seeds.json",                     dir: "tampa-bay", flags: "", follow: 3 }
          - { file: "district_seeds_south_florida.json",        dir: "south_florida", flags: "", follow: 3 }
          - { file: "district_seeds_schools_pb_broward.json",   dir: "schools_pb_broward", flags: "", follow: 3 }
          - { file: "district_seeds_schools_miami_dade.json",   dir: "schools_miami_dade", flags: "", follow: 3 }
          - { file: "district_seeds_bmf_orgs.json",             dir: "bmf_orgs", flags: "", follow: 3 }
          - { file: "district_seeds_bmf_tier_bc.json",          dir: "bmf_tier_bc", flags: "", follow: 3 }
          - { file: "district_seeds_discovered.json",           dir: "discovered", flags: "", follow: 3 }
          - { file: "district_seeds_platforms.json",            dir: "platforms", flags: "", follow: 3 }
          # Only this set bypasses robots, and only because the operator asked.
          # follow is 2 rather than 3: 82 unique hosts with no robots fetch to
          # amortise means dead hosts dominate the runtime.
          - { file: "district_seeds_robots_retry.json",         dir: "robots_retry",
              flags: "--ignore-robots", follow: 2 }
    steps:
      # branch head, not the triggering SHA -- the discover job commits a seed
      # file that this job must be able to see
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install PDF reader
        run: pip install --quiet pypdf

      - name: Harvest ${{ matrix.set.dir }}
        working-directory: grants
        env:
          FORCE: ${{ inputs.force }}
        run: |
          SEEDS="data/${{ matrix.set.file }}"
          if [ ! -f "$SEEDS" ]; then
            echo "$SEEDS does not exist - nothing to harvest for this set."; exit 0
          fi
          OUT="data/district_pages_${{ matrix.set.dir }}"
          if [ -d "$OUT" ] && [ "$FORCE" != "true" ]; then
            echo "$OUT already harvested - skipping. Re-run with force to refresh."
            exit 0
          fi
          python3 scripts/10_district_crawl.py harvest \
            --seeds "data/${{ matrix.set.file }}" --pages "$OUT" \
            --follow ${{ matrix.set.follow }} ${{ matrix.set.flags }} | tee /tmp/h.log

      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ matrix.set.dir }}"
            echo '```'
            cat /tmp/h.log 2>/dev/null || echo "(skipped - already harvested)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pages-${{ matrix.set.dir }}
          path: grants/data/district_pages_${{ matrix.set.dir }}/
          retention-days: 14
          if-no-files-found: ignore

  collect:
    needs: harvest
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: /tmp/harvested
          pattern: pages-*

      - name: Move harvested pages into the tree
        run: |
          shopt -s nullglob
          for d in /tmp/harvested/pages-*/; do
            name=$(basename "$d" | sed 's/^pages-//')
            mkdir -p "grants/data/district_pages_$name"
            cp -r "$d". "grants/data/district_pages_$name/" 2>/dev/null || true
          done
          find grants/data -name '_harvest_log.txt' -exec head -1 {} \; || true

      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grants/data/district_pages_*/
          if git diff --staged --quiet; then
            echo "No new page content."
          else
            git commit -m "Harvest district pages (automated)

          Fetched by the district-crawl workflow. Plain text only; the raw HTML
          cache stays out of the repo."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

  # Clean + structure the harvested text. Runs on every harvest, and is the step
  # that replaces hand-review: it reads only the extracted blocks, not the pages,
  # so the whole corpus is about a dollar and can be re-run on each refresh.
  extract:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Strip navigation chrome
        working-directory: grants
        run: python3 scripts/19_declutter.py --pages 'data/district_pages_*' --out data/clean

      - name: Extract awards with the full filter schema
        working-directory: grants
        run: python3 scripts/20_extract_awards.py --pages 'data/clean/*' --out data/15_awards.csv

      # Skipped, loudly, until the key exists -- a missing key must not fail the
      # run, but it must also never look like the pass ran and found nothing.
      - name: Enrich with the model
        working-directory: grants
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LIMIT: ${{ inputs.enrich_limit || '0' }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::warning::ANTHROPIC_API_KEY not set - skipping enrichment."
            echo "15_awards.csv is the regex output: a candidate set, not publishable."
            python3 scripts/21_enrich.py --dry-run || true
            exit 0
          fi
          pip install --quiet anthropic
          # A sample run writes its own file. Pointing it at the full output
          # would leave a 40-row CSV looking like the finished 364-row set.
          OUT=data/16_awards_enriched.csv
          [ "$LIMIT" != "0" ] && OUT=data/16_awards_sample.csv
          python3 scripts/21_enrich.py \
            --in data/15_awards.csv --out "$OUT" \
            --limit "$LIMIT" --only-awards 2>&1 | tee /tmp/enrich.log
          {
            echo "### Enrichment (limit=$LIMIT)"
            echo '```'; cat /tmp/enrich.log; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit extracted awards
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The response cache is a build artifact keyed by content hash; it is
          # regenerated for free and would add thousands of files to the tree.
          git add grants/data/clean grants/data/15_awards.csv grants/data/16_awards_sample.csv \
                  grants/data/16_awards_enriched.csv 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "no change in extracted awards"
          else
            git commit -m "Extract and enrich awards (automated)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

  wayback:
    needs: collect
    if: always()
    runs-on: ubuntu-latest
    # The Archive's CDX API takes 5-15s per query, so 197 seeds cannot finish in 25.
    timeout-minutes: 60
    steps:
      # branch head so the harvest logs committed by `collect` are present
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet pypdf

      - name: Recover failed seeds from the Internet Archive
        working-directory: grants
        run: |
          if [ -f data/13_wayback_report.csv ]; then
            echo "already recovered - skipping"; exit 0
          fi
          mkdir -p data/district_pages_wayback
          python3 scripts/17_wayback.py \
            --logs data/district_pages_*/_harvest_log.txt \
            --limit 60 \
            --pages data/district_pages_wayback \
            --report data/13_wayback_report.csv 2>&1 | tail -60

      # MUST be always(): a cancelled step skips everything after it, so the
      # incremental report written to disk was discarded when the job hit its cap.
      - name: Snapshot availability for robots-disallowed pages
        if: always()
        working-directory: grants
        run: |
          if [ -f data/14_wayback_robots.csv ]; then
            echo "already surveyed - skipping"; exit 0
          fi
          # Availability ONLY -- the script never fetches content for this class.
          python3 scripts/17_wayback.py \
            --logs data/district_pages_*/_harvest_log.txt \
            --only robots --limit 90 \
            --pages /tmp/unused_robots_pages \
            --report data/14_wayback_robots.csv 2>&1 | tail -30

      - name: Commit recovered pages
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grants/data/district_pages_wayback/ grants/data/13_wayback_report.csv grants/data/14_wayback_robots.csv 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "nothing recovered"
          else
            git commit -m "Recover failed seeds from the Internet Archive (automated)"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
