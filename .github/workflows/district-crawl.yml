# Harvests the district / education-foundation pages on a GitHub runner, which has
# the open network access the dev sandbox does not.
#
# Runs AUTOMATICALLY on any push that touches the crawler or its seed list -- there
# is nothing to click and no secret to configure. It fetches each seed page, flattens
# it to plain text, and commits the text into grants/data/district_pages*/ so the
# extraction can happen anywhere afterwards.
#
# Deliberately no API key: harvesting and extracting are separate jobs so the network
# step needs no credentials at all.

name: District crawl

on:
  push:
    branches:
      - claude/grants-scholarships-app-idea-7xdfgz
    paths:
      - "grants/data/district_seeds*.json"
      - "grants/scripts/10_district_crawl.py"
      - ".github/workflows/district-crawl.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: district-crawl-${{ github.ref }}
  cancel-in-progress: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Harvest seed pages
        working-directory: grants
        run: |
          : > /tmp/harvest.log
          for f in data/district_seeds*.json; do
            region=$(basename "$f" .json | sed 's/^district_seeds_*//')
            region=${region:-tampa-bay}
            echo "### $region ($f)" | tee -a /tmp/harvest.log
            python3 scripts/10_district_crawl.py harvest \
              --seeds "$f" --pages "data/district_pages_$region" \
              | tee -a /tmp/harvest.log
            echo | tee -a /tmp/harvest.log
          done

      - name: Summary
        if: always()
        run: |
          {
            echo "## District crawl"
            echo '```'
            cat /tmp/harvest.log 2>/dev/null || echo "(harvest did not run)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload harvested text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: district-pages
          path: grants/data/district_pages*/
          retention-days: 14
          if-no-files-found: ignore

      - name: Commit harvested pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add grants/data/district_pages*/
          if git diff --staged --quiet; then
            echo "No new page content."
          else
            git commit -m "Harvest district pages (automated)

          Fetched by the district-crawl workflow. Plain text only; the raw HTML
          cache stays out of the repo."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
